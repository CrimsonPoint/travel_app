services:
    nginx:
        image: nginx:latest
        volumes:
            - ./:/var/www/
            - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
        ports:
            - "8876:80"
        container_name: app_nginx
        networks:
            - backend
        depends_on:
            - app

    app:
        build:
            context: .
            dockerfile: _docker/app/Dockerfile
        volumes:
            - ./:/var/www
            - storage:/var/www/html/storage
        ports:
            - "8080:8080"
        expose:
            - "8080"
        networks:
            - backend
        depends_on:
            - db
        container_name: app_main

    db:
        image: mysql:8.0
        restart: always
        volumes:
            - ./tmp/db:/var/lib/mysql
        environment:
            MYSQL_DATABASE: travel_main
            MYSQL_ROOT_PASSWORD: root
        ports:
            - 8101:3306
        command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
        container_name: app_db
        networks:
            - backend

networks:
    backend:
        driver: bridge
volumes:
    storage:
